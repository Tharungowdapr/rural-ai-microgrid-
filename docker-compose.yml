version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rural-microgrid-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - microgrid-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rural-microgrid-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/ml/lstm_model.h5
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
    networks:
      - microgrid-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rural-microgrid-db
    environment:
      - POSTGRES_USER=microgrid
      - POSTGRES_PASSWORD=microgrid123
      - POSTGRES_DB=rural_microgrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - microgrid-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U microgrid" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rural-microgrid-cache
    ports:
      - "6379:6379"
    networks:
      - microgrid-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  microgrid-network:
    driver: bridge

volumes:
  postgres_data:
